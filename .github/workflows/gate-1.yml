name: Focused personal-development checks

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "requirements*"
      - ".github/workflows/gate-1.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install .
      - name: Ten explicit review-regression cases (requires approved cumulative budget)
        run: python tests/run_tests.py --limit 10
      - name: Build wheel (no extra test execution)
        run: python -m pip wheel --no-deps --wheel-dir dist .
