name: Offline static checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Personal-development policy: no automatic full suite or version matrix.
# Static checks also run on main pushes. Only PR events execute the four
# affected cases in one invocation. Coordinator must budget every run/retry.
jobs:
  offline-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax only (no imports or tests)
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = sorted(
              path
              for root in ("src", "tests", "tools")
              for path in Path(root).rglob("*.py")
          )
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"{len(paths)} Python files parsed; no imports or tests executed")
          PY
      - name: All documentation file links
        run: python tools/check_docs.py
      - name: Existing pinned runtime dependencies
        if: github.event_name == 'pull_request'
        run: python -m pip install -r requirements.txt
      - name: Four explicit offline synthetic cases (one invocation)
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: src
        run: >-
          python tests/run_tests.py
          test_public_document_dogfood.PublicDocumentDogfoodTests.test_rejected_deep_quarantine_never_adopts_and_withdrawal_purges
          test_public_document_dogfood.PublicDocumentDogfoodTests.test_light_quarantine_is_bounded_immutable_and_not_a_reply
          test_public_document_dogfood.PublicDocumentDogfoodTests.test_selection_context_binds_request_prompt_and_has_no_authority
          test_public_document_dogfood.PublicDocumentDogfoodTests.test_hostile_transport_envelope_is_sanitized_and_stays_reserved
