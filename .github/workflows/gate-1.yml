name: Offline static checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Personal-development policy: no automatic full suite or version matrix.
# Select any change-relevant regression cases explicitly and include all local,
# CI and retry executions in the shared per-trial budget (see AGENTS.md).
jobs:
  offline-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax only (no imports or tests)
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = sorted(
              path
              for root in ("src", "tests", "tools")
              for path in Path(root).rglob("*.py")
          )
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"{len(paths)} Python files parsed; no imports or tests executed")
          PY
      - name: All documentation file links
        run: python tools/check_docs.py
